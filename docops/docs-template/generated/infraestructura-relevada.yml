# del repositorio.
# Cuándo se actualiza: push a main con cambio en los archivos .tf.
#
# 🤖 ESTE ARCHIVO SÍ LO ESCRIBE EL AGENTE. No editar a mano. Se contrasta
# (no reemplaza) contra docs/manifest/infraestructura-declarada.yml.
# =============================================================================

