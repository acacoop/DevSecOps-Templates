name: DocOps - Preview docs changes on PR

# -----------------------------------------------------------------------------
# Wrapper fino (igual que docops-sync.yml) que invoca el workflow reusable de
# preview. Corre en cada PR contra main y deja un comentario con lo que
# cambiaría en Confluence si se mergea — sin publicar nada todavía.
# -----------------------------------------------------------------------------

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  docops-preview:
    uses: acacoop/DevSecOps-Templates/.github/workflows/docops-preview.yml@main
    secrets:
      CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
      CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
      CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
      CONFLUENCE_SPACE_KEY: ${{ secrets.CONFLUENCE_SPACE_KEY }}
