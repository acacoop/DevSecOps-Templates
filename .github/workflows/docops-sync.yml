name: DocOps - Sync docs to Confluence (reusable)

# -----------------------------------------------------------------------------
# Workflow REUSABLE (workflow_call): no corre solo. Cualquier repo de la
# organización lo invoca desde su propio workflow fino (ver
# docops/docs-template/consumer-workflow-example.yml) pasando sus secrets de
# Confluence. Así el pipeline de DocOps vive en UN solo lugar
# (acacoop/DevSecOps-Templates) y cada repo solo "lo llama".
#
# Qué hace, por cada push a main del repo QUE LO INVOCA:
#   1. Asegura que exista la página raíz del proyecto en Confluence
#      (título = nombre del repo).
#   2. Para cada uno de los 5 bloques de documentación, calcula una huella
#      del contenido fuente relevante y la compara contra la huella ya
#      publicada (guardada como content property en la propia página).
#        - Sin cambios  -> se omite (no genera versiones vacías).
#        - Con cambios  -> regenera y publica:
#            * "2. Desarrollo" y "4. Infraestructura relevada": escaneo
#              real (scan_code.py / scan_terraform.py) sobre el checkout
#              del repo que invoca.
#            * "1. Negocio", "3. Infraestructura declarada" y
#              "5. Modelado de amenaza": se publica el YAML de docs/
#              del repo que invoca, tal cual (lo completa Jira).
#
# Convención de carpetas esperada en el repo que invoca (ver
# docops/docs-template/ en este mismo repo para el scaffolding inicial):
#   docs/manifest/negocio.yml
#   docs/manifest/infraestructura-declarada.yml
#   docs/generated/desarrollo.yml
#   docs/generated/infraestructura-relevada.yml
#   docs/generated/amenazas.yml
# -----------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      root_page_title:
        description: "Título de la página raíz en Confluence. Default: nombre del repo que invoca."
        required: false
        type: string
        default: ""
      templates_ref:
        description: "Ref (branch/tag) de DevSecOps-Templates del que se toman los scripts. Default: main."
        required: false
        type: string
        default: "main"
      ai_enrichment:
        description: >-
          Completa con GitHub Copilot CLI los campos narrativos que el
          escaneo determinístico deja en null, en "2. Desarrollo" y "4.
          Infraestructura relevada" (ej. funciones esenciales, roles,
          integraciones). Nunca pisa un valor ya determinado por el
          escaneo, y si falla (sin token, sin CLI instalada, etc.) no
          interrumpe la publicación: el campo simplemente queda en null.
          Requiere el secret COPILOT_GITHUB_TOKEN (ver docops/README.md).
          Default: true.
        required: false
        type: boolean
        default: true
    secrets:
      CONFLUENCE_BASE_URL:
        required: true
      CONFLUENCE_EMAIL:
        required: true
      CONFLUENCE_API_TOKEN:
        required: true
      CONFLUENCE_SPACE_KEY:
        required: true
      COPILOT_GITHUB_TOKEN:
        description: >-
          Personal Access Token de grano fino (cuenta personal con asiento
          de Copilot, permiso "Copilot Requests") usado por ai_enrich.py
          para invocar Copilot CLI. Solo hace falta si ai_enrichment=true.
          Si no se provee, el enriquecimiento se omite sin romper el
          pipeline.
        required: false

permissions:
  contents: read

jobs:
  publish-to-confluence:
    runs-on: ubuntu-latest
    env:
      CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
      CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
      CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
      CONFLUENCE_SPACE_KEY: ${{ secrets.CONFLUENCE_SPACE_KEY }}
      ROOT_TITLE: ${{ inputs.root_page_title || github.event.repository.name }}
    steps:
      - name: Checkout repo que invoca
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout DevSecOps-Templates (scripts DocOps)
        uses: actions/checkout@v4
        with:
          repository: acacoop/DevSecOps-Templates
          ref: ${{ inputs.templates_ref }}
          path: .docops-templates

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r .docops-templates/docops/scripts/requirements.txt

      - name: Setup Node.js (para GitHub Copilot CLI)
        if: inputs.ai_enrichment
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install GitHub Copilot CLI
        if: inputs.ai_enrichment
        run: npm install -g @github/copilot

      - name: Ensure root project page exists
        working-directory: .docops-templates/docops/scripts
        run: |
          echo "<p>Página raíz generada automáticamente por el pipeline DocOps para <b>${ROOT_TITLE}</b>.</p>" > /tmp/root.html
          python confluence_publish.py --title "$ROOT_TITLE" --body-file /tmp/root.html

      - name: Sync "1. Negocio" (manifest, solo si cambió)
        working-directory: .docops-templates/docops/scripts
        env:
          GITHUB_WORKSPACE_CALLER: ${{ github.workspace }}
        run: |
          set -e
          PAGE_TITLE="$ROOT_TITLE - 1. Negocio"
          LOCAL_FP=$(python compute_fingerprint.py --root "$GITHUB_WORKSPACE_CALLER" --include "docs/manifest/negocio.yml")
          REMOTE_FP=$(python confluence_fingerprint.py --title "$PAGE_TITLE" --get)
          if [ "$LOCAL_FP" = "$REMOTE_FP" ] && [ -n "$REMOTE_FP" ]; then
            echo "Sin cambios en negocio.yml, se omite publicación."
          else
            python yaml_to_confluence.py --yaml "$GITHUB_WORKSPACE_CALLER/docs/manifest/negocio.yml" --title "$PAGE_TITLE" --out /tmp/negocio.html
            python confluence_publish.py --title "$PAGE_TITLE" --parent-title "$ROOT_TITLE" --body-file /tmp/negocio.html
            python confluence_fingerprint.py --title "$PAGE_TITLE" --set "$LOCAL_FP"
          fi

      - name: Sync "2. Desarrollo" (escaneo de código, solo si cambió)
        working-directory: .docops-templates/docops/scripts
        env:
          GITHUB_WORKSPACE_CALLER: ${{ github.workspace }}
        run: |
          set -e
          PAGE_TITLE="$ROOT_TITLE - 2. Desarrollo"
          LOCAL_FP=$(python compute_fingerprint.py --root "$GITHUB_WORKSPACE_CALLER" \
            --include "*" "**/*" \
            --exclude "docs/**" "infra/**" ".github/**" "**/__pycache__/**" "**/node_modules/**" "**/.terraform/**")
          REMOTE_FP=$(python confluence_fingerprint.py --title "$PAGE_TITLE" --get)
          if [ "$LOCAL_FP" = "$REMOTE_FP" ] && [ -n "$REMOTE_FP" ]; then
            echo "Sin cambios en el código de la aplicación, se omite publicación."
          else
            python scan_code.py --root "$GITHUB_WORKSPACE_CALLER" --out /tmp/desarrollo.yml \
              --fingerprint "$LOCAL_FP" --commit "${{ github.sha }}"
            if [ "${{ inputs.ai_enrichment }}" = "true" ]; then
              COPILOT_GITHUB_TOKEN="${{ secrets.COPILOT_GITHUB_TOKEN }}" python ai_enrich.py \
                --root "$GITHUB_WORKSPACE_CALLER" --yaml /tmp/desarrollo.yml \
                || echo "Enriquecimiento con IA omitido (no bloqueante)."
            fi
            python yaml_to_confluence.py --yaml /tmp/desarrollo.yml --title "$PAGE_TITLE" --out /tmp/desarrollo.html
            python confluence_publish.py --title "$PAGE_TITLE" --parent-title "$ROOT_TITLE" --body-file /tmp/desarrollo.html
            python confluence_fingerprint.py --title "$PAGE_TITLE" --set "$LOCAL_FP"
          fi

      - name: Sync "3. Infraestructura declarada" (manifest, solo si cambió)
        working-directory: .docops-templates/docops/scripts
        env:
          GITHUB_WORKSPACE_CALLER: ${{ github.workspace }}
        run: |
          set -e
          PAGE_TITLE="$ROOT_TITLE - 3. Infraestructura declarada"
          LOCAL_FP=$(python compute_fingerprint.py --root "$GITHUB_WORKSPACE_CALLER" --include "docs/manifest/infraestructura-declarada.yml")
          REMOTE_FP=$(python confluence_fingerprint.py --title "$PAGE_TITLE" --get)
          if [ "$LOCAL_FP" = "$REMOTE_FP" ] && [ -n "$REMOTE_FP" ]; then
            echo "Sin cambios en infraestructura-declarada.yml, se omite publicación."
          else
            python yaml_to_confluence.py --yaml "$GITHUB_WORKSPACE_CALLER/docs/manifest/infraestructura-declarada.yml" --title "$PAGE_TITLE" --out /tmp/infra-declarada.html
            python confluence_publish.py --title "$PAGE_TITLE" --parent-title "$ROOT_TITLE" --body-file /tmp/infra-declarada.html
            python confluence_fingerprint.py --title "$PAGE_TITLE" --set "$LOCAL_FP"
          fi

      - name: Sync "4. Infraestructura relevada" (escaneo de Terraform, solo si cambió)
        working-directory: .docops-templates/docops/scripts
        env:
          GITHUB_WORKSPACE_CALLER: ${{ github.workspace }}
        run: |
          set -e
          PAGE_TITLE="$ROOT_TITLE - 4. Infraestructura relevada"
          LOCAL_FP=$(python compute_fingerprint.py --root "$GITHUB_WORKSPACE_CALLER" --include "*.tf" "**/*.tf")
          REMOTE_FP=$(python confluence_fingerprint.py --title "$PAGE_TITLE" --get)
          if [ "$LOCAL_FP" = "$REMOTE_FP" ] && [ -n "$REMOTE_FP" ]; then
            echo "Sin cambios en los archivos .tf, se omite publicación."
          else
            python scan_terraform.py --root "$GITHUB_WORKSPACE_CALLER" --out /tmp/infra-relevada.yml \
              --fingerprint "$LOCAL_FP" --commit "${{ github.sha }}"
            if [ "${{ inputs.ai_enrichment }}" = "true" ]; then
              COPILOT_GITHUB_TOKEN="${{ secrets.COPILOT_GITHUB_TOKEN }}" python ai_enrich.py \
                --root "$GITHUB_WORKSPACE_CALLER" --yaml /tmp/infra-relevada.yml \
                || echo "Enriquecimiento con IA omitido (no bloqueante)."
            fi
            python yaml_to_confluence.py --yaml /tmp/infra-relevada.yml --title "$PAGE_TITLE" --out /tmp/infra-relevada.html
            python confluence_publish.py --title "$PAGE_TITLE" --parent-title "$ROOT_TITLE" --body-file /tmp/infra-relevada.html
            python confluence_fingerprint.py --title "$PAGE_TITLE" --set "$LOCAL_FP"
          fi

      - name: Sync "5. Modelado de amenaza" (solo si cambió)
        working-directory: .docops-templates/docops/scripts
        env:
          GITHUB_WORKSPACE_CALLER: ${{ github.workspace }}
        run: |
          set -e
          PAGE_TITLE="$ROOT_TITLE - 5. Modelado de amenaza (borrador)"
          LOCAL_FP=$(python compute_fingerprint.py --root "$GITHUB_WORKSPACE_CALLER" --include "docs/generated/amenazas.yml")
          REMOTE_FP=$(python confluence_fingerprint.py --title "$PAGE_TITLE" --get)
          if [ "$LOCAL_FP" = "$REMOTE_FP" ] && [ -n "$REMOTE_FP" ]; then
            echo "Sin cambios en amenazas.yml, se omite publicación."
          else
            python yaml_to_confluence.py --yaml "$GITHUB_WORKSPACE_CALLER/docs/generated/amenazas.yml" --title "$PAGE_TITLE" --out /tmp/amenazas.html
            python confluence_publish.py --title "$PAGE_TITLE" --parent-title "$ROOT_TITLE" --body-file /tmp/amenazas.html
            python confluence_fingerprint.py --title "$PAGE_TITLE" --set "$LOCAL_FP"
          fi
